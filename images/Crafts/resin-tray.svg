<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F2"/>
      <stop offset="100%" stop-color="#EFE4DD"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C341F"/>
      <stop offset="50%" stop-color="#7A482D"/>
      <stop offset="100%" stop-color="#462413"/>
    </linearGradient>
    <linearGradient id="resinRiver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#0EA5E9"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="goldHandles" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="trayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2D1F17" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="#E3D1BF" stroke-width="2" stroke-dasharray="8 8"/>

  <g filter="url(#trayShadow)" transform="rotate(-6, 400, 390)">
    <!-- Main Tray Board -->
    <rect x="150" y="240" width="500" height="300" rx="22" fill="url(#walnut)"/>

    <!-- Natural Wood Live-Edge Grain Top/Bottom -->
    <!-- Resin River flowing diagonally through center -->
    <path d="M 150 330 Q 280 390 380 320 T 650 360 L 650 440 Q 480 390 350 480 T 150 410 Z" fill="url(#resinRiver)"/>

    <!-- Translucent Shimmer & Swirls in Resin -->
    <path d="M 170 345 Q 280 400 370 340 T 630 380" stroke="rgba(255,255,255,0.45)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 210 380 Q 320 430 420 370 T 600 420" stroke="rgba(255,255,255,0.3)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Wood Texture Details on sides -->
    <path d="M 180 270 Q 350 260 520 275" stroke="#3D1E0E" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 200 290 Q 380 280 500 295" stroke="#3D1E0E" stroke-width="1.5" fill="none" opacity="0.3"/>
    <path d="M 200 490 Q 380 500 580 485" stroke="#3D1E0E" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Laser Engraved Custom Family Name / Monogram on Wood Portion -->
    <rect x="440" y="270" width="160" height="40" rx="6" fill="#3D1F10" opacity="0.35"/>
    <text x="520" y="295" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" fill="#E8B48B" text-anchor="middle">✨ حفر ليزر: عائلة الكرام</text>

    <!-- Metallic Gold / Brass Handles on sides -->
    <rect x="115" y="340" width="22" height="100" rx="6" fill="url(#goldHandles)"/>
    <rect x="127" y="360" width="14" height="60" rx="4" fill="#1E293B"/>
    <rect x="663" y="340" width="22" height="100" rx="6" fill="url(#goldHandles)"/>
    <rect x="659" y="360" width="14" height="60" rx="4" fill="#1E293B"/>
  </g>

  <!-- Product Caption Tag -->
  <g transform="translate(400, 680)">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="#8F415C"/>
    <text x="0" y="6" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">🌊 صينية تقديم فاخرة — خشب طبيعي وريزن</text>
  </g>
  <text x="400" y="745" font-family="'Cairo', sans-serif" font-size="13" font-weight="600" fill="#8C7A70" text-anchor="middle">دمج ريزن إيبوكسي بحري مع خشب الجوز الطبيعي وحفر ليزر مخصص</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF8F4"/>
      <stop offset="100%" stop-color="#EFE2D6"/>
    </linearGradient>
    <linearGradient id="clockWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F3B1E"/>
      <stop offset="50%" stop-color="#8E522C"/>
      <stop offset="100%" stop-color="#4F2612"/>
    </linearGradient>
    <linearGradient id="clockGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="clockShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2D1C12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="#E3D1BF" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Clock Face -->
  <g filter="url(#clockShadow)">
    <circle cx="400" cy="380" r="210" fill="url(#clockWood)"/>
    <!-- Outer Laser Cut Ring -->
    <circle cx="400" cy="380" r="195" fill="none" stroke="url(#clockGold)" stroke-width="4"/>
    <circle cx="400" cy="380" r="150" fill="none" stroke="#B88A58" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- Geometric Arabesque Spokes / Pattern -->
    <g stroke="url(#clockGold)" stroke-width="2" opacity="0.5">
      <line x1="400" y1="190" x2="400" y2="230"/>
      <line x1="400" y1="530" x2="400" y2="570"/>
      <line x1="210" y1="380" x2="250" y2="380"/>
      <line x1="550" y1="380" x2="590" y2="380"/>
    </g>

    <!-- Roman Numerals (Laser cut / engraved) -->
    <text x="400" y="235" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="url(#clockGold)" text-anchor="middle">XII</text>
    <text x="545" y="390" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="url(#clockGold)" text-anchor="middle">III</text>
    <text x="400" y="550" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="url(#clockGold)" text-anchor="middle">VI</text>
    <text x="255" y="390" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="url(#clockGold)" text-anchor="middle">IX</text>

    <!-- Laser Engraved Family Name in Center -->
    <rect x="310" y="420" width="180" height="30" rx="4" fill="#2E1408" opacity="0.7"/>
    <text x="400" y="440" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#E8B48B" text-anchor="middle">✨ عائلة السعيد • حفر ليزر</text>

    <!-- Clock Hands (Quiet Sweep Movement Style) -->
    <!-- Hour Hand -->
    <line x1="400" y1="380" x2="400" y2="290" stroke="url(#clockGold)" stroke-width="8" stroke-linecap="round"/>
    <!-- Minute Hand -->
    <line x1="400" y1="380" x2="475" y2="330" stroke="url(#clockGold)" stroke-width="5" stroke-linecap="round"/>
    <!-- Center Pin -->
    <circle cx="400" cy="380" r="10" fill="url(#clockGold)"/>
    <circle cx="400" cy="380" r="4" fill="#241006"/>
  </g>

  <!-- Product Caption Tag -->
  <g transform="translate(400, 680)">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="#8F415C"/>
    <text x="0" y="6" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">🏺 ساعة حائط خشبية هندسية — حفر ليزر مخصص</text>
  </g>
  <text x="400" y="745" font-family="'Cairo', sans-serif" font-size="13" font-weight="600" fill="#8C7A70" text-anchor="middle">ساعة جدارية فنية مقاس 40 سم من الخشب الطبيعي مع ماكينة صامتة</text>
</svg>

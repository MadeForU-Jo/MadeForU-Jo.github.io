<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F2"/>
      <stop offset="100%" stop-color="#EFE3DB"/>
    </linearGradient>
    <linearGradient id="oliveWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#784A28"/>
      <stop offset="50%" stop-color="#9E6539"/>
      <stop offset="100%" stop-color="#5C351B"/>
    </linearGradient>
    <linearGradient id="emeraldResin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2D1C13" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="#E3D1BF" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- 4 Coasters Stack / Arrangement -->
  <!-- Coaster 1 (Back left) -->
  <g filter="url(#cShadow)" transform="translate(200, 240) rotate(-12)">
    <rect width="180" height="180" rx="20" fill="url(#oliveWood)"/>
    <path d="M 0 100 Q 90 60 180 110 L 180 180 L 0 180 Z" fill="url(#emeraldResin)"/>
    <path d="M 10 115 Q 90 75 170 120" stroke="rgba(255,255,255,0.4)" stroke-width="4" fill="none"/>
  </g>

  <!-- Coaster 2 (Back right) -->
  <g filter="url(#cShadow)" transform="translate(420, 250) rotate(10)">
    <rect width="180" height="180" rx="20" fill="url(#oliveWood)"/>
    <path d="M 0 90 Q 90 130 180 80 L 180 180 L 0 180 Z" fill="url(#emeraldResin)"/>
    <path d="M 10 105 Q 90 145 170 95" stroke="rgba(255,255,255,0.4)" stroke-width="4" fill="none"/>
  </g>

  <!-- Coaster 3 (Front Center - Highlight with laser engraving) -->
  <g filter="url(#cShadow)" transform="translate(300, 360)">
    <rect width="210" height="210" rx="24" fill="url(#oliveWood)"/>
    <path d="M 0 120 Q 105 80 210 130 L 210 210 L 0 210 Z" fill="url(#emeraldResin)"/>
    <path d="M 15 135 Q 105 95 195 145" stroke="rgba(255,255,255,0.5)" stroke-width="5" fill="none"/>
    <!-- Laser Engraved Logo / Initials on Wood -->
    <circle cx="105" cy="65" r="34" fill="#4B2712" opacity="0.4"/>
    <text x="105" y="73" font-family="'Cairo', sans-serif" font-size="22" font-weight="900" fill="#F0C39C" text-anchor="middle">M &amp; S</text>
  </g>

  <!-- Product Caption Tag -->
  <g transform="translate(400, 680)">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="#8F415C"/>
    <text x="0" y="6" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">🌊 طقم كوسترات ريزن وخشب — حفر حروف وشعارات</text>
  </g>
  <text x="400" y="745" font-family="'Cairo', sans-serif" font-size="13" font-weight="600" fill="#8C7A70" text-anchor="middle">طقم 4 أو 6 قطع خشب طبيعي مع ريزن ملون وحفر مخصص</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF7F2"/>
      <stop offset="100%" stop-color="#EFE1D2"/>
    </linearGradient>
    <linearGradient id="walnutStand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B3B1F"/>
      <stop offset="50%" stop-color="#884C28"/>
      <stop offset="100%" stop-color="#4F2610"/>
    </linearGradient>
    <filter id="standShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2D1C12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="#E3D1BF" stroke-width="2" stroke-dasharray="8 8"/>

  <g filter="url(#standShadow)">
    <!-- Interlocking Folding Rehal / Stand -->
    <!-- Left Wing -->
    <path d="M 220 250 L 390 380 L 330 540 L 160 410 Z" fill="url(#walnutStand)"/>
    <!-- Right Wing -->
    <path d="M 580 250 L 410 380 L 470 540 L 640 410 Z" fill="url(#walnutStand)"/>
    <!-- Center Hinge Intersection -->
    <rect x="385" y="360" width="30" height="40" rx="4" fill="#3D1D0B"/>

    <!-- Laser Cut Islamic Arabesque Openwork Lattice -->
    <g stroke="#E8B48B" stroke-width="2" fill="none" opacity="0.6">
      <ellipse cx="270" cy="330" rx="35" ry="50" transform="rotate(-36, 270, 330)"/>
      <ellipse cx="530" cy="330" rx="35" ry="50" transform="rotate(36, 530, 330)"/>
      <circle cx="270" cy="330" r="14"/>
      <circle cx="530" cy="330" r="14"/>
    </g>

    <!-- Custom Laser Engraved Plaque at Bottom of Wing -->
    <rect x="250" y="470" width="300" height="34" rx="6" fill="#381B0C" opacity="0.8"/>
    <text x="400" y="492" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#E8B48B" text-anchor="middle">✨ إهداء خاص: حفر اسم أو دعاء بالليزر</text>
  </g>

  <!-- Product Caption Tag -->
  <g transform="translate(400, 680)">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="#8F415C"/>
    <text x="0" y="6" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">🏺 حامل مصحف وكتب خشبي فاخر — حفر ليزر</text>
  </g>
  <text x="400" y="745" font-family="'Cairo', sans-serif" font-size="13" font-weight="600" fill="#8C7A70" text-anchor="middle">ستاند خشبي مفرغ بنقوش إسلامية هندسية قابلة للطي والإهداء</text>
</svg>

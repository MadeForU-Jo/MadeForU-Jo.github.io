<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#EFE2D2"/>
    </linearGradient>
    <linearGradient id="puzzleBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DEB3"/>
      <stop offset="50%" stop-color="#E8CCA0"/>
      <stop offset="100%" stop-color="#DAB884"/>
    </linearGradient>
    <filter id="puzShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2D1C12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="#E3D1BF" stroke-width="2" stroke-dasharray="8 8"/>

  <g filter="url(#puzShadow)" transform="rotate(-4, 400, 390)">
    <!-- Wooden Name Board Base -->
    <rect x="130" y="290" width="540" height="200" rx="28" fill="url(#puzzleBase)"/>
    <rect x="145" y="305" width="510" height="170" rx="20" fill="none" stroke="#B88A58" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- 3D Colorful Wooden Cutout Letters in Sockets -->
    <!-- Letter O -->
    <g transform="translate(180, 340)">
      <circle cx="40" cy="45" r="40" fill="#38BDF8"/>
      <circle cx="40" cy="45" r="20" fill="url(#puzzleBase)"/>
      <text x="40" y="58" font-family="'Cairo', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">ع</text>
    </g>
    <!-- Letter M -->
    <g transform="translate(290, 340)">
      <rect x="0" y="5" width="80" height="80" rx="16" fill="#F472B6"/>
      <text x="40" y="58" font-family="'Cairo', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">م</text>
    </g>
    <!-- Letter R -->
    <g transform="translate(400, 340)">
      <rect x="0" y="5" width="80" height="80" rx="16" fill="#34D399"/>
      <text x="40" y="58" font-family="'Cairo', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">ر</text>
    </g>
    <!-- Little Star / Bear Wood Cutout Shape -->
    <g transform="translate(510, 340)">
      <rect x="0" y="5" width="80" height="80" rx="16" fill="#FBBF24"/>
      <text x="40" y="56" font-family="'Cairo', sans-serif" font-size="32" text-anchor="middle">⭐</text>
    </g>

    <!-- Laser Engraved Personalized Dedication on Board Bottom -->
    <rect x="220" y="440" width="360" height="26" rx="6" fill="#4B2712" opacity="0.3"/>
    <text x="400" y="458" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✨ هدية خاصة بحب من بابا وماما • حفر ليزر مخصص</text>
  </g>

  <!-- Product Caption Tag -->
  <g transform="translate(400, 680)">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="#8F415C"/>
    <text x="0" y="6" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">👶 بازل اسم الطفل الخشبي — مجسمات وحفر ليزر</text>
  </g>
  <text x="400" y="745" font-family="'Cairo', sans-serif" font-size="13" font-weight="600" fill="#8C7A70" text-anchor="middle">لعبة تعليمية وتذكار شخصي آمن للأطفال من خشب الزان الصلب</text>
</svg>
